<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Game Library</title>
    <script>
      // GitHub Pages SPA routing fix.
      // Encodes the current path into sessionStorage then redirects to the root,
      // where index.html restores it via window.history.replaceState.
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      location.replace(location.origin + '/game-library/');
    </script>
  </head>
  <body></body>
</html>
